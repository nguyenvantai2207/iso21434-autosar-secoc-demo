[env:bcm_nano]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
monitor_port = rfc2217://localhost:4000?ign_set_control
monitor_echo = yes
monitor_eol = CR
build_src_filter = +<bcm_ecu.cpp>
lib_deps =
    autowp/autowp-mcp2515 @ ^1.0.3
    rweather/Crypto @ ^0.4.0
    arduino-libraries/Servo @ ^1.2.1

[env:central_uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
build_src_filter = +<central_ecu.cpp>
lib_deps =
    autowp/autowp-mcp2515 @ ^1.0.3
    rweather/Crypto @ ^0.4.0

[env:central_mega]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
build_src_filter = +<central_ecu.cpp>
lib_deps =
    autowp/autowp-mcp2515 @ ^1.0.3
    rweather/Crypto @ ^0.4.0